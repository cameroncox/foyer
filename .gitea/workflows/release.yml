name: release

# Builds the image and pushes it to the Gitea registry:
#   tag vX.Y.Z      -> :X.Y.Z and :latest (latest tracks the last version tag, never develop)
#   push to develop -> :dev and :<7-char sha> (any earlier develop build can be rolled back to)
# PRs and other branches build nothing here; ci.yml covers them.
#
# Needs repo secrets REGISTRY_USERNAME and REGISTRY_TOKEN: a Gitea user and an access token
# with package write access to the foyer owner.

on:
  push:
    branches: [develop]
    tags: ['v*']

env:
  IMAGE: gitea.lan.casadecox.org/foyer/foyer

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Work out tags and version
        id: tags
        run: |
          sha="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tags=$IMAGE:$version,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0-dev+$sha"
            echo "tags=$IMAGE:dev,$IMAGE:$sha" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: gitea.lan.casadecox.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.title=Foyer
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
