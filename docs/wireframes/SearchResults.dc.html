<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#2456C9}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 760px; background: #F3F3F0; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif;">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 32px; background: #FFFFFF; border-bottom: 1px solid #D4D4CE;">
    <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em; min-width: 120px;">Foyer</div>
    <label style="flex: 1 1 320px; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 14px; border: 1px solid #2456C9; border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 3px #E5ECFB;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C57" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" value="arr" aria-label="Search bookmarks" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none; color: #1C1C1A;">
      <button type="button" aria-label="Clear search" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: #EDEDE9; color: #5C5C57; display: grid; place-items: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </label>
    <div style="display: flex; align-items: center; gap: 10px; min-width: 120px; justify-content: flex-end;">
      <div role="group" aria-label="Theme" style="display: flex; border: 1px solid #C4C4BE; border-radius: 10px; overflow: hidden; background: #FFFFFF;">
        <button type="button" aria-label="Light theme" style="width: 44px; height: 44px; border: 0; background: #E7E7E2; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
        <button type="button" aria-label="Dark theme" style="width: 44px; height: 44px; border: 0; border-left: 1px solid #D4D4CE; background: #FFFFFF; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
        <button type="button" aria-label="System theme" style="width: 44px; height: 44px; border: 0; border-left: 1px solid #D4D4CE; background: #FFFFFF; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></button>
      </div>
      <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #C4C4BE; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #1C1C1A;">Edit</button>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 14px; color: #5C5C57;">4 bookmarks match “arr”</div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
        <a href="{{item.url}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: #FFFFFF; border: 1px solid {{item.border}}; border-radius: 12px; text-decoration: none; box-shadow: {{item.ring}}; opacity: {{item.opacity}};">
          <div style="position: relative; width: 40px; height: 40px; flex: none; border-radius: 9px; background: #E7E7E2; display: grid; place-items: center; font-weight: 600; color: #5C5C57;">{{item.letter}}
            <span style="position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #FFFFFF; background: {{item.dot}};"></span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0;">
            <span style="font-size: 15px; font-weight: 500; line-height: 1.2; color: #1C1C1A;">{{item.name}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 4px;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1; color: #5C5C57; background: #EDEDE9; border-radius: 5px; padding: 3px 6px;">#{{item.host}}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1; color: #1B3F94; background: #E5ECFB; border: 1px solid #C7D5F5; border-radius: 5px; padding: 2px 6px;">#arr</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
    <div style="font-size: 13px; color: #5C5C57; display: flex; align-items: center; gap: 6px;"><kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; border: 1px solid #C4C4BE; border-radius: 5px; padding: 1px 6px; background: #FFFFFF;">Enter</kbd> opens the first result · <kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; border: 1px solid #C4C4BE; border-radius: 5px; padding: 1px 6px; background: #FFFFFF;">Esc</kbd> clears</div>
  </main>

  <button type="button" aria-label="Add bookmark" style="position: absolute; right: 32px; bottom: 32px; width: 60px; height: 60px; border: 0; border-radius: 50%; background: #2456C9; color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(36, 86, 201, 0.35);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = { running: '#1E9E52', stopped: '#D23B2E', warn: '#E0A100' };
    const mk = (name, sub, status, first) => ({
      name, url: 'https://' + sub + '.lan.casadecox.org', letter: name[0], host: 'docker-4', dot: dots[status],
      border: first ? '#2456C9' : '#D4D4CE', ring: first ? '0 0 0 3px #E5ECFB' : 'none', opacity: status === 'stopped' ? 0.6 : 1
    });
    return { items: [mk('Sonarr', 'sonarr', 'warn', true), mk('Radarr', 'radarr', 'running'), mk('Lidarr', 'lidarr', 'running'), mk('Prowlarr', 'prowlarr', 'stopped')] };
  }
}
</script>
</body>
</html>
