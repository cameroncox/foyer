<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer main page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#2456C9}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 980px; background: #F3F3F0; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif;">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 32px; background: #FFFFFF; border-bottom: 1px solid #D4D4CE;">
    <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em; min-width: 120px;">Foyer</div>
    <label style="flex: 1 1 320px; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid #C4C4BE; border-radius: 10px; background: #FAFAF8;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" placeholder="Search bookmarks" aria-label="Search bookmarks" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none; color: #1C1C1A;">
      <kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C5C57; border: 1px solid #C4C4BE; border-radius: 5px; padding: 1px 6px;">/</kbd>
    </label>
    <div style="display: flex; align-items: center; gap: 10px; min-width: 120px; justify-content: flex-end;">
      <div role="group" aria-label="Theme" style="display: flex; border: 1px solid #C4C4BE; border-radius: 10px; overflow: hidden; background: #FFFFFF;">
        <button type="button" aria-label="Light theme" style="width: 44px; height: 44px; border: 0; background: #E7E7E2; display: grid; place-items: center; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
        <button type="button" aria-label="Dark theme" style="width: 44px; height: 44px; border: 0; border-left: 1px solid #D4D4CE; background: #FFFFFF; display: grid; place-items: center; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
        <button type="button" aria-label="System theme" style="width: 44px; height: 44px; border: 0; border-left: 1px solid #D4D4CE; background: #FFFFFF; display: grid; place-items: center; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></button>
      </div>
      <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #C4C4BE; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #1C1C1A;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Edit</button>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 36px;">
    <sc-for list="{{categories}}" as="cat" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 14px;">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C57; display: flex; align-items: center; gap: 10px;">{{cat.name}}<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; letter-spacing: 0; text-transform: none;">{{cat.count}}</span></h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;">
          <sc-for list="{{cat.items}}" as="item" hint-placeholder-count="4">
            <a href="{{item.url}}" title="{{item.title}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; min-height: 44px; background: #FFFFFF; border: 1px solid #D4D4CE; border-radius: 12px; text-decoration: none; opacity: {{item.opacity}};">
              <div style="position: relative; width: 40px; height: 40px; flex: none; border-radius: 9px; background: #E7E7E2; display: grid; place-items: center; font-weight: 600; color: #5C5C57;">{{item.letter}}
                <sc-if value="{{item.hasStatus}}" hint-placeholder-val="{{item.hasStatus}}">
                  <span aria-label="{{item.statusLabel}}" style="position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #FFFFFF; background: {{item.dot}};"></span>
                </sc-if>
              </div>
              <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0;">
                <span style="font-size: 15px; font-weight: 500; line-height: 1.2; color: #1C1C1A; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{item.name}}</span>
                <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                  <sc-if value="{{item.hasStatus}}" hint-placeholder-val="{{item.hasStatus}}">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1; color: #5C5C57; background: #EDEDE9; border-radius: 5px; padding: 3px 6px; display: flex; align-items: center; gap: 5px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>#{{item.dockerHost}}</span>
                  </sc-if>
                  <sc-for list="{{item.tags}}" as="tag" hint-placeholder-count="1">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1; color: #5C5C57; border: 1px solid #D4D4CE; border-radius: 5px; padding: 2px 6px;">#{{tag.label}}</span>
                  </sc-for>
                </div>
              </div>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <button type="button" aria-label="Add bookmark" style="position: absolute; right: 32px; bottom: 32px; width: 60px; height: 60px; border: 0; border-radius: 50%; background: #2456C9; color: #FFFFFF; display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 20px rgba(36, 86, 201, 0.35);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = { running: '#1E9E52', stopped: '#D23B2E', warn: '#E0A100' };
    const labels = { running: 'Running', stopped: 'Stopped', warn: 'Unhealthy, starting or restarting' };
    const mk = (name, sub, status, dockerHost, tags) => ({
      name, dockerHost: dockerHost || '', tags: (tags || []).map(label => ({ label })), url: 'https://' + sub + '.lan.casadecox.org', letter: name[0],
      hasStatus: !!status, dot: dots[status] || 'transparent', statusLabel: labels[status] || '',
      title: name + ' — ' + sub + '.lan.casadecox.org' + (status ? ' (' + labels[status] + ')' : ''),
      opacity: status === 'stopped' ? 0.6 : 1
    });
    const raw = [
      { name: 'Media', items: [mk('Jellyfin', 'jellyfin', 'running', 'docker-4'), mk('Jellyseerr', 'requests', 'running', 'docker-1'), mk('Sonarr', 'sonarr', 'warn', 'docker-4', ['arr']), mk('Radarr', 'radarr', 'running', 'docker-4', ['arr']), mk('Prowlarr', 'prowlarr', 'stopped', 'docker-4')] },
      { name: 'Services', items: [mk('File Browser', 'share', 'running', 'docker-2'), mk('Paperless', 'paperless', 'running', 'docker-3', ['docs']), mk('Gitea', 'gitea', 'running', 'docker-1')] },
      { name: 'Infrastructure', items: [mk('Proxmox', 'pve-1', null, null, ['pve-1']), mk('Datacenter Manager', 'pdm', null, null, ['proxmox']), mk('OPNsense', 'opnsense', null, null, ['router', 'dhcp']), mk('TrueNAS', 'truenas', null, null, ['nas']), mk('Traefik', 'traefik', 'running', 'docker-1')] },
      { name: 'Uncategorized', items: [mk('ARM', 'arm', 'running', 'docker-2')] }
    ];
    return { categories: raw.map(c => ({ ...c, count: c.items.length })) };
  }
}
</script>
</body>
</html>
