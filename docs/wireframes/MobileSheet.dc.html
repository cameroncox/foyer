<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer phone edit sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#2456C9}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F3F3F0; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0.4;">
    <div style="height: 60px; background: #FFFFFF; border-bottom: 1px solid #D4D4CE;"></div>
    <div style="height: 36px; background: #E5ECFB;"></div>
    <div style="padding: 18px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 62px; background: #FFFFFF; border: 1px solid #D4D4CE; border-radius: 12px;"></div>
      <div style="height: 62px; background: #FFFFFF; border: 1px solid #D4D4CE; border-radius: 12px;"></div>
      <div style="height: 62px; background: #FFFFFF; border: 1px solid #D4D4CE; border-radius: 12px;"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28, 28, 26, 0.35);"></div>

  <div role="dialog" aria-label="Edit bookmark" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 28px rgba(28, 28, 26, 0.2); padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 14px;">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C4C4BE;"></div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 600;">Edit bookmark</h2>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #EDEDE9; color: #1C1C1A; display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Name
      <input type="text" value="OPNsense" style="height: 46px; padding: 0 12px; border: 1px solid #C4C4BE; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400;">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Category
      <select style="height: 46px; padding: 0 10px; border: 1px solid #C4C4BE; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; background: #FFFFFF;">
        <option>Uncategorized</option>
        <option>Media</option>
        <option>Services</option>
        <option selected="selected">Infrastructure</option>
        <option>New category…</option>
      </select>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">URL
      <input type="url" value="https://opnsense.lan.casadecox.org" style="height: 46px; padding: 0 12px; border: 1px solid #C4C4BE; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 14px;">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Tags
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 46px; box-sizing: border-box; padding: 6px 8px; border: 1px solid #C4C4BE; border-radius: 10px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400; border: 1px solid #D4D4CE; border-radius: 6px; padding: 3px 2px 3px 8px; display: flex; align-items: center; gap: 2px;">#router<button type="button" aria-label="Remove tag router" style="width: 28px; height: 28px; border: 0; background: transparent; color: #5C5C57; display: grid; place-items: center; padding: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400; border: 1px solid #D4D4CE; border-radius: 6px; padding: 3px 2px 3px 8px; display: flex; align-items: center; gap: 2px;">#dhcp<button type="button" aria-label="Remove tag dhcp" style="width: 28px; height: 28px; border: 0; background: transparent; color: #5C5C57; display: grid; place-items: center; padding: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>
        <input type="text" placeholder="Add tag" style="flex: 1; min-width: 70px; height: 32px; border: 0; outline: none; font-family: 'IBM Plex Mono', monospace; font-size: 14px; background: transparent;">
      </div>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Icon
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" value="opnsense.svg" style="flex: 1; min-width: 0; height: 46px; padding: 0 12px; border: 1px solid #C4C4BE; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 400;">
        <div aria-label="Icon preview" style="width: 46px; height: 46px; flex: none; border-radius: 10px; border: 1px dashed #A8A8A2; background: #E7E7E2; display: grid; place-items: center; font-weight: 600; color: #5C5C57;">O</div>
      </div>
    </label>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px;">
      <button type="button" style="height: 48px; border: 1px solid #E8B4AE; border-radius: 10px; background: #FFFFFF; color: #B42318; font: inherit; font-size: 15px; font-weight: 500;">Delete</button>
      <button type="button" style="height: 48px; border: 0; border-radius: 10px; background: #2456C9; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600;">Save</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
