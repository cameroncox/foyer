<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer edit bookmark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#2456C9}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 760px; background: #F3F3F0; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif;">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 32px; background: #FFFFFF; border-bottom: 1px solid #D4D4CE;">
    <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em; min-width: 120px;">Foyer</div>
    <label style="flex: 1 1 320px; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid #C4C4BE; border-radius: 10px; background: #FAFAF8; opacity: 0.45;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C57" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" placeholder="Search bookmarks" aria-label="Search bookmarks" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none;">
    </label>
    <div style="display: flex; align-items: center; gap: 10px; justify-content: flex-end; opacity: 0.45;">
      <button type="button" aria-label="Theme: light" style="width: 44px; height: 44px; border: 1px solid #C4C4BE; border-radius: 10px; background: #FFFFFF; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1C1A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
      <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #2456C9; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600;">Done</button>
    </div>
  </header>

  <div style="padding: 32px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C57; opacity: 0.4;">Infrastructure</div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; max-width: 820px;">
      <div style="height: 62px; background: #FFFFFF; border: 1px solid #C4C4BE; border-radius: 12px; opacity: 0.3;"></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 10px 12px 12px; background: #FFFFFF; border: 2px solid #2456C9; border-radius: 12px; box-shadow: 0 0 0 4px #E5ECFB;">
        <div style="width: 36px; height: 36px; flex: none; border-radius: 8px; background: #E7E7E2; display: grid; place-items: center; font-weight: 600; color: #5C5C57;">O</div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <span style="font-size: 14px; font-weight: 500;">OPNsense</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5C57;">opnsense.lan.casadecox.org</span>
        </div>
      </div>
      <div style="height: 62px; background: #FFFFFF; border: 1px solid #C4C4BE; border-radius: 12px; opacity: 0.3;"></div>
    </div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C57; margin-top: 20px; opacity: 0.4;">Uncategorized</div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; max-width: 820px; opacity: 0.3;">
      <div style="height: 62px; background: #FFFFFF; border: 1px solid #C4C4BE; border-radius: 12px;"></div>
    </div>
  </div>

  <button type="button" aria-label="Close edit bookmark" style="position: absolute; right: 32px; bottom: 32px; width: 60px; height: 60px; border: 0; border-radius: 50%; background: #1C1C1A; color: #FFFFFF; display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 20px rgba(28, 28, 26, 0.3);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>

  <div role="dialog" aria-label="Edit bookmark" style="position: absolute; bottom: 108px; right: 32px; width: 400px; max-width: calc(100% - 32px); box-sizing: border-box; background: #FFFFFF; border: 1px solid #C4C4BE; border-radius: 14px; box-shadow: 0 12px 32px rgba(28, 28, 26, 0.16); padding: 22px; display: flex; flex-direction: column; gap: 16px;">
    <h2 style="margin: 0; font-size: 17px; font-weight: 600;">Edit bookmark</h2>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Name
      <input type="text" value="OPNsense" style="height: 42px; padding: 0 12px; border: 1px solid #C4C4BE; border-radius: 9px; font: inherit; font-size: 15px; font-weight: 400;">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Category
      <select style="height: 42px; padding: 0 10px; border: 1px solid #C4C4BE; border-radius: 9px; font: inherit; font-size: 15px; font-weight: 400; background: #FFFFFF;">
        <option>Media</option>
        <option>Services</option>
        <option selected="selected">Infrastructure</option>
        <option>Uncategorized</option>
        <option>New category…</option>
      </select>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">URL
      <input type="url" value="https://opnsense.lan.casadecox.org" style="height: 42px; padding: 0 12px; border: 1px solid #C4C4BE; border-radius: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Tags
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 42px; box-sizing: border-box; padding: 5px 8px; border: 1px solid #C4C4BE; border-radius: 9px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 400; color: #1C1C1A; background: #EDEDE9; border-radius: 6px; padding: 4px 4px 4px 8px; display: flex; align-items: center; gap: 4px;">#router<button type="button" aria-label="Remove tag router" style="width: 20px; height: 20px; border: 0; background: transparent; color: #5C5C57; display: grid; place-items: center; padding: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 400; color: #1C1C1A; background: #EDEDE9; border-radius: 6px; padding: 4px 4px 4px 8px; display: flex; align-items: center; gap: 4px;">#dhcp<button type="button" aria-label="Remove tag dhcp" style="width: 20px; height: 20px; border: 0; background: transparent; color: #5C5C57; display: grid; place-items: center; padding: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>
        <input type="text" placeholder="Add tag" style="flex: 1; min-width: 80px; height: 30px; border: 0; outline: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400; background: transparent;">
      </div>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500;">Icon
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" value="opnsense.svg" style="flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid #C4C4BE; border-radius: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400;">
        <div aria-label="Icon preview" style="width: 42px; height: 42px; flex: none; border-radius: 9px; border: 1px dashed #A8A8A2; background: #E7E7E2; display: grid; place-items: center; font-weight: 600; color: #5C5C57;">O</div>
      </div>
    </label>

    <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
      <button type="button" style="height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #B42318; font: inherit; font-size: 14px; font-weight: 500; margin-right: auto;">Delete</button>
      <button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #C4C4BE; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 14px; color: #1C1C1A;">Cancel</button>
      <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 9px; background: #2456C9; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600;">Save</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
