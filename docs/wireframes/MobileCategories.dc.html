<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer phone categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#2456C9}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="flex: none; display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 12px 0 6px; border-bottom: 1px solid #D4D4CE;">
    <button type="button" aria-label="Back to edit mode" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #1C1C1A; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <h1 style="flex: 1; margin: 0; font-size: 17px; font-weight: 600;">Categories</h1>
    <span style="font-size: 13px; color: #5C5C57;">Drag to reorder</span>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 4px; height: 56px; padding-left: 12px; border: 1px solid #D4D4CE; border-radius: 12px; background: #FAFAF8;">
          <input type="text" value="{{row.name}}" aria-label="Category name" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #1C1C1A;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5C5C57; padding: 0 6px;">{{row.count}}</span>
          <button type="button" aria-label="Delete category" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #B42318; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg></button>
          <button type="button" aria-label="Drag to reorder" style="width: 48px; height: 54px; border: 0; border-left: 1px solid #E3E3DE; background: transparent; display: grid; place-items: center; touch-action: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#5C5C57" aria-hidden="true"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg></button>
        </li>
      </sc-for>
      <li style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px 0 12px; border: 1px dashed #C4C4BE; border-radius: 12px;">
        <span style="flex: 1; font-size: 16px; color: #5C5C57;">Uncategorized</span>
        <span style="font-size: 12px; color: #5C5C57;">always last</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5C5C57;">1</span>
      </li>
    </ol>
  </main>

  <div style="flex: none; padding: 0 16px 12px;">
    <button type="button" style="width: 100%; height: 48px; border: 1px dashed #A8A8A2; border-radius: 10px; background: #FAFAF8; color: #1C1C1A; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Import browser bookmarks</button>
  </div>
  <form style="flex: none; display: flex; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid #D4D4CE; background: #FFFFFF;">
    <label style="flex: 1; display: flex;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">New category</span>
      <input type="text" placeholder="New category" style="flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 1px solid #C4C4BE; border-radius: 10px; font: inherit; font-size: 16px;">
    </label>
    <button type="button" style="height: 48px; padding: 0 18px; border: 0; border-radius: 10px; background: #2456C9; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600;">Add</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [{ name: 'Media', count: 5 }, { name: 'Services', count: 3 }, { name: 'Infrastructure', count: 5 }, { name: 'Downloads', count: 2 }] };
  }
}
</script>
</body>
</html>
