<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer phone import preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#2456C9}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="flex: none; display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 12px 0 6px; border-bottom: 1px solid #D4D4CE;">
    <button type="button" aria-label="Back to categories" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #1C1C1A; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
      <h1 style="margin: 0; font-size: 17px; font-weight: 600;">Import bookmarks</h1>
      <span style="font-size: 12px; color: #5C5C57;">62 bookmarks in 6 folders</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 4px 8px; display: flex; flex-direction: column;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
      <sc-if value="{{row.root}}" hint-placeholder-val="{{row.root}}">
        <div style="padding: 14px 12px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5C57;">{{row.name}}</div>
      </sc-if>
      <sc-if value="{{row.folder}}" hint-placeholder-val="{{row.folder}}">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px 6px {{row.indent}}; border-bottom: 1px solid #EFEFEB; opacity: {{row.opacity}};">
          <input type="checkbox" defaultChecked="{{row.checked}}" style="width: 22px; height: 22px; accent-color: #2456C9; flex: none;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 15px; font-style: {{row.style}};">{{row.name}} <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C5C57;">{{row.count}}</span></span>
            <span style="font-size: 12px; color: #5C5C57; display: flex; align-items: center; gap: 6px;">→ {{row.dest}}
              <sc-if value="{{row.isNew}}" hint-placeholder-val="{{row.isNew}}">
                <span style="font-size: 11px; font-weight: 500; color: #1B3F94; background: #E5ECFB; border-radius: 5px; padding: 1px 6px;">new</span>
              </sc-if>
            </span>
          </span>
        </label>
      </sc-if>
    </sc-for>
  </main>

  <div style="flex: none; padding: 12px 16px 20px; border-top: 1px solid #D4D4CE; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 13px; color: #5C5C57;">3 bookmarks already in Foyer will be skipped.</span>
    <button type="button" style="height: 50px; border: 0; border-radius: 10px; background: #2456C9; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600;">Import 27 bookmarks</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const root = name => ({ name, root: true, folder: false });
    const f = (name, level, count, dest, isNew, checked, loose) => ({
      name, root: false, folder: true, indent: (12 + level * 24) + 'px', count, dest, isNew: !!isNew,
      checked: checked !== false, opacity: checked === false ? 0.5 : 1, style: loose ? 'italic' : 'normal'
    });
    return {
      rows: [
        root('Bookmarks bar'),
        f('Not in a folder', 0, 5, 'Uncategorized', false, true, true),
        f('Homelab', 0, 3, 'Homelab', true),
        f('Network', 1, 4, 'Network', true),
        f('Media', 1, 6, 'Media', false),
        f('Work', 0, 12, 'Work', true),
        f('Recipes', 0, 9, 'Recipes', true, false),
        root('Other bookmarks'),
        f('Reading list', 0, 23, 'Reading list', true, false)
      ]
    };
  }
}
</script>
</body>
</html>
