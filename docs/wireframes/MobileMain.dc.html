<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foyer on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#2456C9}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F3F3F0; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 8px 0 16px; background: #FFFFFF; border-bottom: 1px solid #D4D4CE;">
    <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.01em;">Foyer</div>
    <button type="button" aria-label="Open menu" aria-expanded="false" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #1C1C1A; display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px;">
    <sc-for list="{{categories}}" as="cat" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 10px;">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C57; display: flex; gap: 8px;">{{cat.name}}<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; letter-spacing: 0;">{{cat.count}}</span></h2>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{cat.items}}" as="item" hint-placeholder-count="3">
            <a href="{{item.url}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px; background: #FFFFFF; border: 1px solid #D4D4CE; border-radius: 12px; text-decoration: none; opacity: {{item.opacity}};">
              <div style="position: relative; width: 36px; height: 36px; flex: none; border-radius: 8px; background: #E7E7E2; display: grid; place-items: center; font-weight: 600; color: #5C5C57;">{{item.letter}}
                <sc-if value="{{item.hasStatus}}" hint-placeholder-val="{{item.hasStatus}}">
                  <span aria-label="{{item.statusLabel}}" style="position: absolute; right: -4px; bottom: -4px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid #FFFFFF; background: {{item.dot}};"></span>
                </sc-if>
              </div>
              <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0;">
                <span style="font-size: 15px; font-weight: 500; line-height: 1.2; color: #1C1C1A;">{{item.name}}</span>
                <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                  <sc-if value="{{item.hasStatus}}" hint-placeholder-val="{{item.hasStatus}}">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1; color: #5C5C57; background: #EDEDE9; border-radius: 5px; padding: 3px 6px;">#{{item.dockerHost}}</span>
                  </sc-if>
                  <sc-for list="{{item.tags}}" as="tag" hint-placeholder-count="1">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1; color: #5C5C57; border: 1px solid #D4D4CE; border-radius: 5px; padding: 2px 6px;">#{{tag.label}}</span>
                  </sc-for>
                </div>
              </div>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = { running: '#1E9E52', stopped: '#D23B2E', warn: '#E0A100' };
    const labels = { running: 'Running', stopped: 'Stopped', warn: 'Unhealthy, starting or restarting' };
    const mk = (name, sub, status, host, tags) => ({
      name, url: 'https://' + sub + '.lan.casadecox.org', letter: name[0], dockerHost: host || '',
      tags: (tags || []).map(label => ({ label })), hasStatus: !!status, dot: dots[status] || 'transparent',
      statusLabel: labels[status] || '', opacity: status === 'stopped' ? 0.6 : 1
    });
    const raw = [
      { name: 'Media', items: [mk('Jellyfin', 'jellyfin', 'running', 'docker-4'), mk('Jellyseerr', 'requests', 'running', 'docker-1'), mk('Sonarr', 'sonarr', 'warn', 'docker-4', ['arr']), mk('Radarr', 'radarr', 'running', 'docker-4', ['arr']), mk('Prowlarr', 'prowlarr', 'stopped', 'docker-4')] },
      { name: 'Infrastructure', items: [mk('Proxmox', 'pve-1', null, null, ['pve-1']), mk('OPNsense', 'opnsense', null, null, ['router', 'dhcp'])] }
    ];
    return { categories: raw.map(c => ({ ...c, count: c.items.length })) };
  }
}
</script>
</body>
</html>
