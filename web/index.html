<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foyer</title>
    <script>
      // Set the color scheme before first paint, as Mantine's ColorSchemeScript does.
      try {
        var saved = localStorage.getItem('mantine-color-scheme-value')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.setAttribute('data-mantine-color-scheme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
