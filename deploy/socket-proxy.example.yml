# Docker socket proxy for each other host Foyer reads remotely.
# Foyer only reads: containers and events. POST stays off, so nothing can change through it.
#
#   docker compose -f socket-proxy.example.yml up -d
#
# Careful: CONTAINERS=1 also allows container inspect, which includes every container's
# environment variables (passwords, tokens). Anyone who can reach port 2375 can read them, so
# publish it on the LAN address only and allow just the host Foyer runs on.
#
# ufw can't do this: Docker's own iptables rules for published ports bypass it. Filter in the
# DOCKER-USER chain instead (and persist it, e.g. with iptables-persistent):
#   iptables -I DOCKER-USER -p tcp -m conntrack --ctorigdstport 2375 ! -s [FOYER HOST IP] -j DROP

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "[THIS HOST'S LAN IP]:2375:2375"
