# Foyer behind Traefik, as a bookmark manager: no Docker hosts, so bookmarks are added by hand.
#
# To also show labeled containers, add FOYER_DOCKERHOSTS_* entries: compose.docker.example.yml
# reads this host through a private socket proxy, and socket-proxy.example.yml exposes another
# host to Foyer. Replace the [BRACKETED] values before starting it.
#
#   docker compose -f compose.example.yml up -d

services:
  foyer:
    # Released images; :dev and :<sha> are develop builds. Or one you built: docker build -t foyer .
    image: ghcr.io/cameroncox/foyer:latest
    container_name: foyer
    restart: unless-stopped
    # Run as the host user that owns ./data. Set UID/GID in .env; both default to 1000.
    user: "${UID:-1000}:${GID:-1000}"
    security_opt:
      - no-new-privileges:true
    # environment:
    #   FOYER_TITLE: "Foyer"            # name in the top bar and the browser tab
    #   FOYER_SEARCH_URL: "https://www.google.com/search?q=%s"   # spotlight web search (default DuckDuckGo)
    volumes:
      # Create it before the first up (mkdir data); a missing dir is created root-owned.
      - ./data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.foyer.entrypoints=http"
      - "traefik.http.routers.foyer.rule=Host(`[FOYER HOSTNAME]`)"
      - "traefik.http.middlewares.foyer-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.foyer.middlewares=foyer-https-redirect"
      - "traefik.http.routers.foyer-secure.entrypoints=https"
      - "traefik.http.routers.foyer-secure.rule=Host(`[FOYER HOSTNAME]`)"
      - "traefik.http.routers.foyer-secure.tls=true"
      - "traefik.http.routers.foyer-secure.service=foyer"
      # Foyer has no login of its own. Put an auth middleware in front of it, such as a
      # forwardAuth one defined in Traefik.
      # - "traefik.http.routers.foyer-secure.middlewares=[AUTH MIDDLEWARE]"
      - "traefik.http.services.foyer.loadbalancer.server.port=8080"

networks:
  # Traefik's network; use whatever yours is called.
  proxy:
    external: true
