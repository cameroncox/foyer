# Foyer on its own, as a bookmark manager: no Docker hosts, so bookmarks are added by hand.
#
# To also show labeled containers, add FOYER_DOCKERHOSTS_* entries: compose.docker.example.yml
# reads this host through a private socket proxy, and socket-proxy.example.yml exposes another
# host to Foyer.
#
#   mkdir -p deploy/data && FOYER_UID=$(id -u) FOYER_GID=$(id -g) docker compose -f deploy/compose.example.yml up -d
#
# Then open http://localhost:8080.

services:
  foyer:
    # Released images; :dev and :<sha> are develop builds. Or one you built: docker build -t foyer .
    image: ghcr.io/cameroncox/foyer:latest
    container_name: foyer
    restart: unless-stopped
    # Run as the host user that owns ./data: set FOYER_UID/FOYER_GID (inline or in .env next to this
    # file); both default to 1000. Not UID/GID, which shells won't pass on or let you set.
    user: "${FOYER_UID:-1000}:${FOYER_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    # environment:
    #   FOYER_TITLE: "Foyer"            # name in the top bar and the browser tab
    #   FOYER_SEARCH_URL: "https://www.google.com/search?q=%s"   # spotlight web search (default DuckDuckGo)
    volumes:
      # Next to this file. Create it before the first up; a missing dir is created root-owned.
      - ./data:/data
    ports:
      - "8080:8080"
    # Foyer has no login of its own, so don't expose it beyond your network without auth in front.
    # Behind Traefik instead: drop `ports`, uncomment these and the networks section below, and
    # fill in the [BRACKETED] values.
    # networks:
    #   - proxy
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=proxy"
    #   - "traefik.http.routers.foyer.entrypoints=https"
    #   - "traefik.http.routers.foyer.rule=Host(`[FOYER HOSTNAME]`)"
    #   - "traefik.http.routers.foyer.tls=true"
    #   - "traefik.http.routers.foyer.middlewares=[AUTH MIDDLEWARE]"
    #   - "traefik.http.services.foyer.loadbalancer.server.port=8080"

# networks:
#   proxy:          # Traefik's network; use whatever yours is called.
#     external: true
