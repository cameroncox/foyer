name: ci

# Branch pushes other than develop are checked through their PRs; v* tags re-check before release.
on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:

# Runs on Gitea Actions (which reads .github/workflows when there's no .gitea/workflows) and on
# GitHub Actions. No dependency caching: the Gitea runner's cache server isn't reachable from job
# networks, so each cache restore/save waited ~4.5 minutes to time out, while cold restores take
# seconds.
jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Foyer.slnx

      - name: Format
        run: dotnet format Foyer.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Foyer.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Foyer.slnx -c Release --no-build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The web app's API types are generated from the running API's OpenAPI document; fail if the
  # committed copy is stale (run `npm run gen:api` with the API up, and commit the result).
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The API must be fully detached (no shared stdout/stderr): the runner waits for every
      # process holding a step's output, so a plain `&` keeps this step running until timeout.
      - name: Start API
        run: |
          dotnet build src/Foyer.Api -c Release
          FOYER_DATA_DIR="$RUNNER_TEMP/foyer" ASPNETCORE_URLS=http://localhost:5080 \
            nohup dotnet src/Foyer.Api/bin/Release/net10.0/Foyer.Api.dll \
            > "$RUNNER_TEMP/api.log" 2>&1 < /dev/null &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/healthz && exit 0; sleep 1; done
          echo "API didn't start:"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Regenerate API types
        working-directory: web
        run: npm ci && npm run gen:api

      - name: Check schema.d.ts is current
        run: git diff --exit-code web/src/api/schema.d.ts

  # Builds and pushes the image once every check above has passed, for pushes to develop and
  # v* tags only (PRs and other branches stop at the checks):
  #   tag vX.Y.Z      -> :X.Y.Z and :latest (latest tracks the last version tag, never develop)
  #   push to develop -> :dev and :<7-char sha> (any earlier develop build can be rolled back to)
  # Pushes to <vars.REGISTRY>/<owner>/<repo>: set the REGISTRY repo variable to the
  # registry's host (a Gitea instance, or ghcr.io). Logs in as the REGISTRY_USERNAME variable with
  # the REGISTRY_TOKEN secret (a token that can write packages for the repo's owner); without them
  # it uses the run's own user and token, which on GitHub can push to ghcr.io given the
  # permissions below.
  release:
    needs: [dotnet, web, api-contract]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out tags and version
        id: tags
        run: |
          if [[ -z "$REGISTRY" ]]; then
            echo "::error::Set the REGISTRY Actions repo variable to the registry's host."
            exit 1
          fi
          IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}"
          sha="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tags=$IMAGE:$version,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0-dev+$sha"
            echo "tags=$IMAGE:dev,$IMAGE:$sha" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.title=Foyer
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
